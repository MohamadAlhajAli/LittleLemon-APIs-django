name: Django CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: LittleLemon

    env:
      DJANGO_SECRET_KEY: ci-only-disposable-key
      DJANGO_DEBUG: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.4"

      - name: Install Pipenv
        run: python -m pip install pipenv==2026.7.1

      - name: Install locked dependencies
        run: python -m pipenv sync --dev

      - name: Check dependencies
        run: python -m pipenv run python -m pip check

      - name: Check Django configuration
        run: python -m pipenv run python manage.py check

      - name: Check for missing migrations
        run: python -m pipenv run python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python -m pipenv run python manage.py migrate --noinput

      - name: Run tests
        run: python -m pipenv run python manage.py test